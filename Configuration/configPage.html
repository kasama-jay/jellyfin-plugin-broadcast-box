<div id="BroadcastBoxConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"><div data-role="content"><div class="content-primary"><form id="BroadcastBoxConfigForm"><h1>Broadcast Box</h1><div class="inputContainer"><label for="WhipUrl">WHIP URL</label><input id="WhipUrl" type="url" required is="emby-input" /></div><div class="selectContainer"><label for="DefaultPreset">Default quality</label><select id="DefaultPreset" is="emby-select"><option value="0">720p / 2.5 Mbps</option><option value="1">1080p / 5 Mbps</option></select></div><label><input id="AllowInsecureHttp" type="checkbox" is="emby-checkbox" /> Allow insecure HTTP on trusted LAN</label><button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button></form><p>Broadcast controls are available from a video’s More menu.</p><script>(function(){var id='b4d3d127-a4cb-4d11-aab9-8b29fe6b74f4',p=$('#BroadcastBoxConfigPage');p.on('pageshow',function(){ApiClient.getPluginConfiguration(id).then(function(c){WhipUrl.value=c.WhipUrl||'';DefaultPreset.value=c.DefaultPreset||1;AllowInsecureHttp.checked=!!c.AllowInsecureHttp;});});p.on('submit','#BroadcastBoxConfigForm',function(e){e.preventDefault();ApiClient.getPluginConfiguration(id).then(function(c){c.WhipUrl=WhipUrl.value.trim();c.DefaultPreset=Number(DefaultPreset.value);c.AllowInsecureHttp=AllowInsecureHttp.checked;return ApiClient.updatePluginConfiguration(id,c);}).then(Dashboard.processPluginConfigurationUpdateResult);return false;});})();</script></div></div></div>
